name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.10'
            stack: 'xarray==2024.10.0 pandas==2.2.3 numpy==2.1.3 dask[array]==2024.10.0'
          - python: '3.13'
            stack: 'xarray==2026.9.0 pandas==3.1.1 numpy==2.5.4 dask[array]==2026.8.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl pytest ${{ matrix.stack }}
      - name: Test installed wheel outside checkout
        run: |
          cd "$RUNNER_TEMP"
          python -m pytest -q "$GITHUB_WORKSPACE/tests"
          python "$GITHUB_WORKSPACE/tests/native_oracle.py"
          python "$GITHUB_WORKSPACE/examples/compare_joins.py"
